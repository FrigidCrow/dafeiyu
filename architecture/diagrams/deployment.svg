<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="deployment-title deployment-desc"><title id="deployment-title">先在 Mac 养，稳定后迁到 Linux</title><desc id="deployment-desc">保留应用结构与数据协议，替换运行环境；迁移时只有一个实例拥有发送权。</desc><defs><marker id="deployment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#8999a6"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .node{cursor:pointer;outline:none} .node:focus rect,.node:hover rect{stroke-width:2.5}</style><rect width="1440" height="1080" fill="#fbfcfd"/><text x="40" y="47" font-size="27" fill="#263644" font-weight="700" text-anchor="start">先在 Mac 养，稳定后迁到 Linux</text><text x="40" y="78" font-size="15" fill="#637480" font-weight="400" text-anchor="start">保留应用结构与数据协议，替换运行环境；迁移时只有一个实例拥有发送权。</text><g class="node" data-node="deployment-launcher" role="button" tabindex="0" aria-label="一个统一启动入口：查看职责与边界"><title>一个统一启动入口 — 拟建统一入口负责版本检测、安装、启停、诊断、备份与打开管理页。它不替代账号扫码，也不拥有另一套主动消息决策。</title><rect x="450" y="110" width="540" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="466" y="133" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="466" y="159" font-size="17" fill="#203341" font-weight="650" text-anchor="start">一个统一启动入口</text><text x="466" y="182" font-size="13" fill="#536675" font-weight="400" text-anchor="start">安装 / 启停 / 诊断 / 备份 / 打开管理页</text></g><rect x="40" y="270" width="640" height="510" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="62" y="301" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">现在 · Mac（Apple Silicon）</text><text x="62" y="325" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">本机 Node + DSH Web；QQ 端独立 Linux 容器</text><rect x="760" y="270" width="640" height="510" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="782" y="301" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">以后 · Linux 服务器</text><text x="782" y="325" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">系统服务保持 Host 常驻；对应架构 QQ 容器</text><rect x="70" y="355" width="580" height="175" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="92" y="386" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">DSH Host · 一个 Node 进程</text><g class="node" data-node="deployment-mac-core" role="button" tabindex="0" aria-label="DSH Web profile：查看职责与边界"><title>DSH Web profile — 复用 DSH 的 AgentLoop、模型适配、工具执行、Session 和 Schedule。它们提供基础设施，不会自动完成“人格、长期记忆和主动陪伴”。</title><rect x="90" y="410" width="250" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="106" y="433" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="106" y="459" font-size="17" fill="#203341" font-weight="650" text-anchor="start">DSH Web profile</text><text x="106" y="482" font-size="13" fill="#536675" font-weight="400" text-anchor="start">AgentLoop / 会话 / HTTP</text></g><g class="node" data-node="deployment-mac-bundle" role="button" tabindex="0" aria-label="统一 Companion：查看职责与边界"><title>统一 Companion — 统一 bundle 内包含产品后端、适配模块与预构建页面。产品模块共用一个状态和协调器，禁止各自启动另一个记忆或主动发信系统。</title><rect x="370" y="410" width="260" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="386" y="433" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="386" y="459" font-size="17" fill="#203341" font-weight="650" text-anchor="start">统一 Companion</text><text x="386" y="482" font-size="13" fill="#536675" font-weight="400" text-anchor="start">同一插件包与数据 schema</text></g><g class="node" data-node="deployment-mac-napcat" role="button" tabindex="0" aria-label="QQ + NapCat 容器：查看职责与边界"><title>QQ + NapCat 容器 — QQ + NapCat 独立于 DSH 进程。推荐 Linux 容器运行个人 QQ，向 OneBot 适配器提供鉴权 WebSocket；登录态和真实消息送达仍需验收。</title><rect x="70" y="585" width="270" height="125" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="86" y="608" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="86" y="634" font-size="17" fill="#203341" font-weight="650" text-anchor="start">QQ + NapCat 容器</text><text x="86" y="657" font-size="13" fill="#536675" font-weight="400" text-anchor="start">独立登录态 / OneBot</text><text x="86" y="677" font-size="13" fill="#536675" font-weight="400" text-anchor="start">amd64 或 arm64 对应镜像</text></g><g class="node" data-node="deployment-mac-sqlite" role="button" tabindex="0" aria-label="本地持久数据根：查看职责与边界"><title>本地持久数据根 — 产品自管 SQLite 是本地文件，不是另一个数据库服务器，也不是 StorageDomain 自动生成的记忆。保存人格版本、人工修订、记忆、观察、计划、发件箱与去重状态；事务实现需要明确验证。</title><rect x="380" y="585" width="270" height="125" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="396" y="608" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="396" y="634" font-size="17" fill="#203341" font-weight="650" text-anchor="start">本地持久数据根</text><text x="396" y="657" font-size="13" fill="#536675" font-weight="400" text-anchor="start">产品 SQLite + Session 日志</text><text x="396" y="677" font-size="13" fill="#536675" font-weight="400" text-anchor="start">配置 / 观察证据 / 版本锁</text></g><polyline points="215,530 215,585" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><polyline points="500,530 500,585" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)" stroke-dasharray="5 5"/><rect x="790" y="355" width="580" height="175" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="812" y="386" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">DSH Host · 一个 Node 进程</text><g class="node" data-node="deployment-linux-core" role="button" tabindex="0" aria-label="DSH Web profile：查看职责与边界"><title>DSH Web profile — 复用 DSH 的 AgentLoop、模型适配、工具执行、Session 和 Schedule。它们提供基础设施，不会自动完成“人格、长期记忆和主动陪伴”。</title><rect x="810" y="410" width="250" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="826" y="433" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="826" y="459" font-size="17" fill="#203341" font-weight="650" text-anchor="start">DSH Web profile</text><text x="826" y="482" font-size="13" fill="#536675" font-weight="400" text-anchor="start">AgentLoop / 会话 / HTTP</text></g><g class="node" data-node="deployment-linux-bundle" role="button" tabindex="0" aria-label="统一 Companion：查看职责与边界"><title>统一 Companion — 统一 bundle 内包含产品后端、适配模块与预构建页面。产品模块共用一个状态和协调器，禁止各自启动另一个记忆或主动发信系统。</title><rect x="1090" y="410" width="260" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1106" y="433" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1106" y="459" font-size="17" fill="#203341" font-weight="650" text-anchor="start">统一 Companion</text><text x="1106" y="482" font-size="13" fill="#536675" font-weight="400" text-anchor="start">同一插件包与数据 schema</text></g><g class="node" data-node="deployment-linux-napcat" role="button" tabindex="0" aria-label="QQ + NapCat 容器：查看职责与边界"><title>QQ + NapCat 容器 — QQ + NapCat 独立于 DSH 进程。推荐 Linux 容器运行个人 QQ，向 OneBot 适配器提供鉴权 WebSocket；登录态和真实消息送达仍需验收。</title><rect x="790" y="585" width="270" height="125" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="806" y="608" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="806" y="634" font-size="17" fill="#203341" font-weight="650" text-anchor="start">QQ + NapCat 容器</text><text x="806" y="657" font-size="13" fill="#536675" font-weight="400" text-anchor="start">独立登录态 / OneBot</text><text x="806" y="677" font-size="13" fill="#536675" font-weight="400" text-anchor="start">amd64 或 arm64 对应镜像</text></g><g class="node" data-node="deployment-linux-sqlite" role="button" tabindex="0" aria-label="本地持久数据根：查看职责与边界"><title>本地持久数据根 — 产品自管 SQLite 是本地文件，不是另一个数据库服务器，也不是 StorageDomain 自动生成的记忆。保存人格版本、人工修订、记忆、观察、计划、发件箱与去重状态；事务实现需要明确验证。</title><rect x="1100" y="585" width="270" height="125" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="1116" y="608" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="1116" y="634" font-size="17" fill="#203341" font-weight="650" text-anchor="start">本地持久数据根</text><text x="1116" y="657" font-size="13" fill="#536675" font-weight="400" text-anchor="start">产品 SQLite + Session 日志</text><text x="1116" y="677" font-size="13" fill="#536675" font-weight="400" text-anchor="start">配置 / 观察证据 / 版本锁</text></g><polyline points="935,530 935,585" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><polyline points="1220,530 1220,585" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)" stroke-dasharray="5 5"/><polyline points="570,210 570,245 360,245 360,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><polyline points="870,210 870,245 1080,245 1080,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><text x="70" y="752" font-size="13" fill="#667884" font-weight="400" text-anchor="start">浏览器关闭：后台可继续；睡眠或退出：活动中断。</text><text x="790" y="752" font-size="13" fill="#667884" font-weight="400" text-anchor="start">远程管理走认证连接；不把数据库直接暴露给网页。</text><g class="node" data-node="deployment-pause" role="button" tabindex="0" aria-label="暂停并停旧端：查看职责与边界"><title>暂停并停旧端 — 先停止旧调度与发送者，再做一致性备份；新端恢复时保持禁发，完成登录与上下文验收后才接管。两个本地锁无法保证跨机器单主。</title><rect x="40" y="860" width="260" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="56" y="883" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="56" y="909" font-size="17" fill="#203341" font-weight="650" text-anchor="start">暂停并停旧端</text><text x="56" y="932" font-size="13" fill="#536675" font-weight="400" text-anchor="start">关闭调度、发送与自动启动</text></g><polyline points="300,915 320,915" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><g class="node" data-node="deployment-backup" role="button" tabindex="0" aria-label="一致性备份：查看职责与边界"><title>一致性备份 — 先停止旧调度与发送者，再做一致性备份；新端恢复时保持禁发，完成登录与上下文验收后才接管。两个本地锁无法保证跨机器单主。</title><rect x="320" y="860" width="260" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="336" y="883" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="336" y="909" font-size="17" fill="#203341" font-weight="650" text-anchor="start">一致性备份</text><text x="336" y="932" font-size="13" fill="#536675" font-weight="400" text-anchor="start">会话、修订、任务、去重键</text></g><polyline points="580,915 600,915" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><g class="node" data-node="deployment-restore" role="button" tabindex="0" aria-label="新端恢复 · 禁发：查看职责与边界"><title>新端恢复 · 禁发 — 先停止旧调度与发送者，再做一致性备份；新端恢复时保持禁发，完成登录与上下文验收后才接管。两个本地锁无法保证跨机器单主。</title><rect x="600" y="860" width="260" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="616" y="883" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="616" y="909" font-size="17" fill="#203341" font-weight="650" text-anchor="start">新端恢复 · 禁发</text><text x="616" y="932" font-size="13" fill="#536675" font-weight="400" text-anchor="start">重建对应架构依赖与版本</text></g><polyline points="860,915 880,915" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><g class="node" data-node="deployment-verify" role="button" tabindex="0" aria-label="登录与上下文验收：查看职责与边界"><title>登录与上下文验收 — 先停止旧调度与发送者，再做一致性备份；新端恢复时保持禁发，完成登录与上下文验收后才接管。两个本地锁无法保证跨机器单主。</title><rect x="880" y="860" width="260" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="896" y="883" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="896" y="909" font-size="17" fill="#203341" font-weight="650" text-anchor="start">登录与上下文验收</text><text x="896" y="932" font-size="13" fill="#536675" font-weight="400" text-anchor="start">凭据重绑、QQ 实际收发</text></g><polyline points="1140,915 1160,915" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#deployment-arrow)"/><g class="node" data-node="deployment-active" role="button" tabindex="0" aria-label="新端独占发送：查看职责与边界"><title>新端独占发送 — 先停止旧调度与发送者，再做一致性备份；新端恢复时保持禁发，完成登录与上下文验收后才接管。两个本地锁无法保证跨机器单主。</title><rect x="1160" y="860" width="260" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1176" y="883" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1176" y="909" font-size="17" fill="#203341" font-weight="650" text-anchor="start">新端独占发送</text><text x="1176" y="932" font-size="13" fill="#536675" font-weight="400" text-anchor="start">旧端停用后才恢复主动性</text></g><text x="40" y="1014" font-size="14" fill="#667884" font-weight="400" text-anchor="start">不是复制 node_modules 或 Mac 二进制；QQ/B站登录可能需要重新验证。两把本地锁不等于跨机单主。</text><text x="40" y="1055" font-size="12" fill="#7a8892" font-weight="400" text-anchor="start">架构设计 · 未运行验收    ｜    节点可点击查看职责与证据</text></svg>