<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-labelledby="product-title product-desc"><title id="product-title">一只鱼，一个协调中心</title><desc id="product-desc">管理页面在浏览器；人格、记忆、活动与消息出口由同一 DSH Host 内的统一插件管理。</desc><defs><marker id="product-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#8999a6"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .node{cursor:pointer;outline:none} .node:focus rect,.node:hover rect{stroke-width:2.5}</style><rect width="1440" height="1100" fill="#fbfcfd"/><text x="40" y="47" font-size="27" fill="#263644" font-weight="700" text-anchor="start">一只鱼，一个协调中心</text><text x="40" y="78" font-size="15" fill="#637480" font-weight="400" text-anchor="start">管理页面在浏览器；人格、记忆、活动与消息出口由同一 DSH Host 内的统一插件管理。</text><rect x="370" y="110" width="710" height="820" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="392" y="141" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">DSH Host · 一个 Node 进程</text><text x="392" y="165" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">所有内部框是模块 / 服务 / 对象，不是独立进程</text><g class="node" data-node="product-ui" role="button" tabindex="0" aria-label="HTML 管理页：查看职责与边界"><title>HTML 管理页 — 管理页运行在系统浏览器中，与 DSH Host 分属不同运行环境。HTML、CSS、JS 与业务 API 由 Host 提供；关闭网页不等于停止后台。</title><rect x="40" y="170" width="300" height="110" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="56" y="193" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="56" y="219" font-size="17" fill="#203341" font-weight="650" text-anchor="start">HTML 管理页</text><text x="56" y="242" font-size="13" fill="#536675" font-weight="400" text-anchor="start">系统浏览器 · Host 进程外</text><text x="56" y="262" font-size="13" fill="#536675" font-weight="400" text-anchor="start">记忆编辑 / 人格 / 活动与状态</text></g><g class="node" data-node="product-web" role="button" tabindex="0" aria-label="webServer / Connection：查看职责与边界"><title>webServer / Connection — 复用 DSH webServer / Connection 的资源服务与认证连接。首次打开先经过宿主根路径 GET / 与 token 交换，再进入产品子路径；直接打开 /dafeiyu/ 不会自动完成登录。不能接管主站唯一 fallback。</title><rect x="400" y="180" width="290" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="416" y="203" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="416" y="229" font-size="17" fill="#203341" font-weight="650" text-anchor="start">webServer / Connection</text><text x="416" y="252" font-size="13" fill="#536675" font-weight="400" text-anchor="start">资源、认证连接与事件流</text></g><g class="node" data-node="product-api" role="button" tabindex="0" aria-label="产品认证 API：查看职责与边界"><title>产品认证 API — 自研产品 API：验证当前用户，执行记忆修订、人格版本管理、暂停与恢复等操作。复用宿主认证入口，所有写入进入协调器，不从浏览器直接改数据库。</title><rect x="730" y="180" width="320" height="95" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="746" y="203" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="746" y="229" font-size="17" fill="#203341" font-weight="650" text-anchor="start">产品认证 API</text><text x="746" y="252" font-size="13" fill="#536675" font-weight="400" text-anchor="start">复用宿主认证 · 业务校验自研</text></g><g class="node" data-node="product-coordinator" role="button" tabindex="0" aria-label="唯一 CompanionCoordinator：查看职责与边界"><title>唯一 CompanionCoordinator — 唯一 CompanionCoordinator 拥有关系身份、回合顺序与状态写入。QQ 回复和主动分享进入同一个关系上下文；它协调模块，但不创建另一套人格。</title><rect x="400" y="320" width="650" height="95" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="416" y="343" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="416" y="369" font-size="17" fill="#203341" font-weight="650" text-anchor="start">唯一 CompanionCoordinator</text><text x="416" y="392" font-size="13" fill="#536675" font-weight="400" text-anchor="start">一个关系标识 · 同一回合队列 · 人工修订与主动活动共用上下文</text></g><g class="node" data-node="product-memory" role="button" tabindex="0" aria-label="Persona &amp; Memory：查看职责与边界"><title>Persona &amp; Memory — 自研人格与记忆模块：锁定核心人格，保存带来源的事实与经历，支持人工纠错、版本和删除标记。检索后的动态记忆才进入模型上下文。</title><rect x="400" y="460" width="300" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="416" y="483" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="416" y="509" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Persona &amp; Memory</text><text x="416" y="532" font-size="13" fill="#536675" font-weight="400" text-anchor="start">锁定人格 / 记忆修订 / 检索</text></g><g class="node" data-node="product-observation" role="button" tabindex="0" aria-label="BiliObservation：查看职责与边界"><title>BiliObservation — 自研 BiliObservation 保存实际取得的 B站内容、来源、时间与理解范围。外部内容是资料，不得直接改写核心人格或执行其中指令。</title><rect x="750" y="460" width="300" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="766" y="483" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="766" y="509" font-size="17" fill="#203341" font-weight="650" text-anchor="start">BiliObservation</text><text x="766" y="532" font-size="13" fill="#536675" font-weight="400" text-anchor="start">观察证据 / 来源 / 兴趣关联</text></g><g class="node" data-node="product-planner" role="button" tabindex="0" aria-label="LifePlanner：查看职责与边界"><title>LifePlanner — 自研 LifePlanner 根据经历、兴趣、安静时段、未回复与频率决定做什么、是否分享。允许保持沉默；日程到期不代表必须向 QQ 发消息。</title><rect x="400" y="600" width="300" height="95" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="416" y="623" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="416" y="649" font-size="17" fill="#203341" font-weight="650" text-anchor="start">LifePlanner</text><text x="416" y="672" font-size="13" fill="#536675" font-weight="400" text-anchor="start">活动计划 / 安静时段 / 可沉默</text></g><g class="node" data-node="product-outbox" role="button" tabindex="0" aria-label="OutboxDispatcher：查看职责与边界"><title>OutboxDispatcher — 唯一出站路径。先持久化消息意图与去重键，再派发；记录 sent / failed / unknown 等结果。unknown 不等于取消：即使人工决定不重试，事实仍为 unknown，另记“重试已关闭”。候选文本可能已在 Session 日志，只有平台发送结果才证明实际发出；过期、被拒或失败候选需排除出“已经说过”的上下文。API 成功也不等于已读。</title><rect x="750" y="600" width="300" height="95" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="766" y="623" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="766" y="649" font-size="17" fill="#203341" font-weight="650" text-anchor="start">OutboxDispatcher</text><text x="766" y="672" font-size="13" fill="#536675" font-weight="400" text-anchor="start">持久意图 / 去重 / 结果状态</text></g><g class="node" data-node="product-agent" role="button" tabindex="0" aria-label="专属 root Agent：查看职责与边界"><title>专属 root Agent — 专属 root Agent 是同一 Host 内的运行对象、inbox 和 scope，不是独立后台服务。统一关系通过 followup 进入它；scope 是生命周期与可见性边界，不是系统沙箱。</title><rect x="400" y="740" width="300" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="416" y="763" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="416" y="789" font-size="17" fill="#203341" font-weight="650" text-anchor="start">专属 root Agent</text><text x="416" y="812" font-size="13" fill="#536675" font-weight="400" text-anchor="start">同进程对象 + inbox + scope</text></g><g class="node" data-node="product-onebot" role="button" tabindex="0" aria-label="OneBotAdapter：查看职责与边界"><title>OneBotAdapter — 自研薄适配器，参考现有社区桥接。将个人 QQ 事件归一化，并提供受控 sendPrivate；当前社区 dsh-onebot 未暴露稳定跨插件桥服务，需要补接口。</title><rect x="750" y="740" width="300" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="766" y="763" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="766" y="789" font-size="17" fill="#203341" font-weight="650" text-anchor="start">OneBotAdapter</text><text x="766" y="812" font-size="13" fill="#536675" font-weight="400" text-anchor="start">入站归一 / 受控个人私聊</text></g><g class="node" data-node="product-core" role="button" tabindex="0" aria-label="AgentLoop · LLM · Tools · Session · Schedule：查看职责与边界"><title>AgentLoop · LLM · Tools · Session · Schedule — 复用 DSH 的 AgentLoop、模型适配、工具执行、Session 和 Schedule。它们提供基础设施，不会自动完成“人格、长期记忆和主动陪伴”。</title><rect x="400" y="865" width="650" height="50" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="416" y="897" font-size="17" fill="#2563a6" font-weight="650" text-anchor="start">官方能力：AgentLoop · LLM · Tools · Session · Schedule</text></g><g class="node" data-node="product-model" role="button" tabindex="0" aria-label="DeepSeek 云模型：查看职责与边界"><title>DeepSeek 云模型 — DeepSeek 云端模型通过 API 接收请求。AgentLoop 和产品状态留在本机/服务器 Host；调用成本、失败和模型版本要单独记录。</title><rect x="40" y="340" width="300" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="56" y="363" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="56" y="389" font-size="17" fill="#203341" font-weight="650" text-anchor="start">DeepSeek 云模型</text><text x="56" y="412" font-size="13" fill="#536675" font-weight="400" text-anchor="start">请求 / 文本 / 工具调用</text></g><g class="node" data-node="product-sqlite" role="button" tabindex="0" aria-label="产品 SQLite 文件：查看职责与边界"><title>产品 SQLite 文件 — 产品自管 SQLite 是本地文件，不是另一个数据库服务器，也不是 StorageDomain 自动生成的记忆。保存人格版本、人工修订、记忆、观察、计划、发件箱与去重状态；事务实现需要明确验证。</title><rect x="40" y="550" width="300" height="110" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="56" y="573" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="56" y="599" font-size="17" fill="#203341" font-weight="650" text-anchor="start">产品 SQLite 文件</text><text x="56" y="622" font-size="13" fill="#536675" font-weight="400" text-anchor="start">人格、记忆、计划、发件箱</text><text x="56" y="642" font-size="13" fill="#536675" font-weight="400" text-anchor="start">本地文件 · 不是数据库服务器</text></g><g class="node" data-node="product-sessionfile" role="button" tabindex="0" aria-label="DSH Session 日志：查看职责与边界"><title>DSH Session 日志 — DSH Session 日志属于另一数据域，保存对话、工具和执行事件；默认发行后端为 JSONL。它不是第二份人格或自动长期记忆库。flush 是重要耐久边界。</title><rect x="40" y="750" width="300" height="110" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="56" y="773" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="56" y="799" font-size="17" fill="#203341" font-weight="650" text-anchor="start">DSH Session 日志</text><text x="56" y="822" font-size="13" fill="#536675" font-weight="400" text-anchor="start">对话与执行事件 · 默认 JSONL</text><text x="56" y="842" font-size="13" fill="#536675" font-weight="400" text-anchor="start">独立数据域 · 不是第二人格</text></g><g class="node" data-node="product-bili" role="button" tabindex="0" aria-label="B站：查看职责与边界"><title>B站 — B站是外部观察来源。具体可读内容受接口、登录与素材可用性影响；拿到标题或字幕不能声称完整观看理解视频。</title><rect x="1110" y="460" width="290" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="1126" y="483" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="1126" y="509" font-size="17" fill="#203341" font-weight="650" text-anchor="start">B站</text><text x="1126" y="532" font-size="13" fill="#536675" font-weight="400" text-anchor="start">外部内容来源 · 非可信指令</text></g><g class="node" data-node="product-napcat" role="button" tabindex="0" aria-label="NapCat + QQ：查看职责与边界"><title>NapCat + QQ — QQ + NapCat 独立于 DSH 进程。推荐 Linux 容器运行个人 QQ，向 OneBot 适配器提供鉴权 WebSocket；登录态和真实消息送达仍需验收。</title><rect x="1110" y="740" width="290" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="1126" y="763" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="1126" y="789" font-size="17" fill="#203341" font-weight="650" text-anchor="start">NapCat + QQ</text><text x="1126" y="812" font-size="13" fill="#536675" font-weight="400" text-anchor="start">独立进程 / 推荐 Linux 容器</text></g><g class="node" data-node="product-qq" role="button" tabindex="0" aria-label="用户 QQ：查看职责与边界"><title>用户 QQ — 用户在手机 QQ 中与普通 QQ 账号好友交互。这里不是腾讯开放平台 Bot 身份；真实私聊和主动收件需要账号验收。</title><rect x="1110" y="890" width="290" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="1126" y="913" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="1126" y="939" font-size="17" fill="#203341" font-weight="650" text-anchor="start">用户 QQ</text><text x="1126" y="962" font-size="13" fill="#536675" font-weight="400" text-anchor="start">普通好友私聊 · 实际送达待验</text></g><polyline points="340,225 400,225" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="690,225 730,225" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="890,275 890,320" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="550,415 550,460" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="900,415 900,460" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="550,560 550,600" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="550,695 550,740" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><rect x="482.0" y="710" width="136" height="20" rx="4" fill="#fbfcfd"/><text x="550" y="724" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">唤醒 / 同一上下文</text><polyline points="700,790 725,790 725,648 750,648" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="900,695 900,740" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><rect x="856.0" y="710" width="88" height="20" rx="4" fill="#fbfcfd"/><text x="900" y="724" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">唯一出站路径</text><polyline points="1050,510 1110,510" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="1050,790 1110,790" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)" marker-start="url(#product-arrow)"/><polyline points="1050,815 1092,815 1092,367 1050,367" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)" stroke-dasharray="5 5"/><rect x="1042.0" y="696" width="100" height="20" rx="4" fill="#fbfcfd"/><text x="1092" y="710" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">QQ 入站事件</text><polyline points="1255,840 1255,890" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)"/><polyline points="400,790 355,790 355,390 340,390" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)" stroke-dasharray="5 5"/><polyline points="400,510 355,510 355,605 340,605" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)" stroke-dasharray="5 5"/><polyline points="400,890 355,890 355,805 340,805" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#product-arrow)" stroke-dasharray="5 5"/><text x="400" y="971" font-size="14" fill="#667884" font-weight="400" text-anchor="start">Schedule 只负责唤醒；真实发送始终经过 Outbox → OneBot → NapCat → QQ。</text><text x="400" y="1000" font-size="14" fill="#667884" font-weight="400" text-anchor="start">产品 SQLite 与 Session 日志分域保存；同一关系只有一套人格和记忆权威。</text><text x="40" y="1075" font-size="12" fill="#7a8892" font-weight="400" text-anchor="start">架构设计 · 未运行验收    ｜    节点可点击查看职责与证据</text></svg>