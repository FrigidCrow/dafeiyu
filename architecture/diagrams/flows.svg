<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1210" role="img" aria-labelledby="flows-title flows-desc"><title id="flows-title">一次聊天，与一次主动分享</title><desc id="flows-desc">两种触发进入同一关系上下文；所有出站统一走发件箱。持久化日志、记忆与发送结果各有职责。</desc><defs><marker id="flows-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#8999a6"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .node{cursor:pointer;outline:none} .node:focus rect,.node:hover rect{stroke-width:2.5}</style><rect width="1440" height="1210" fill="#fbfcfd"/><text x="40" y="47" font-size="27" fill="#263644" font-weight="700" text-anchor="start">一次聊天，与一次主动分享</text><text x="40" y="78" font-size="15" fill="#637480" font-weight="400" text-anchor="start">两种触发进入同一关系上下文；所有出站统一走发件箱。持久化日志、记忆与发送结果各有职责。</text><rect x="40" y="115" width="1360" height="450" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="62" y="146" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">A · 主人发来一句话</text><text x="62" y="170" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">从个人 QQ 入站；模型产出消息候选，产品完成决策后才进入发送。</text><g class="node" data-node="flows-qq" role="button" tabindex="0" aria-label="普通 QQ 好友：查看职责与边界"><title>普通 QQ 好友 — 用户在手机 QQ 中与普通 QQ 账号好友交互。这里不是腾讯开放平台 Bot 身份；真实私聊和主动收件需要账号验收。</title><rect x="70" y="220" width="180" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="86" y="243" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="86" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">普通 QQ 好友</text></g><g class="node" data-node="flows-napcat" role="button" tabindex="0" aria-label="NapCat + QQ：查看职责与边界"><title>NapCat + QQ — QQ + NapCat 独立于 DSH 进程。推荐 Linux 容器运行个人 QQ，向 OneBot 适配器提供鉴权 WebSocket；登录态和真实消息送达仍需验收。</title><rect x="290" y="220" width="180" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="306" y="243" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="306" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">NapCat + QQ</text></g><g class="node" data-node="flows-onebot" role="button" tabindex="0" aria-label="OneBotAdapter：查看职责与边界"><title>OneBotAdapter — 自研薄适配器，参考现有社区桥接。将个人 QQ 事件归一化，并提供受控 sendPrivate；当前社区 dsh-onebot 未暴露稳定跨插件桥服务，需要补接口。</title><rect x="510" y="220" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="526" y="243" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="526" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">OneBotAdapter</text></g><g class="node" data-node="flows-coordinator" role="button" tabindex="0" aria-label="Coordinator：查看职责与边界"><title>Coordinator — 唯一 CompanionCoordinator 拥有关系身份、回合顺序与状态写入。QQ 回复和主动分享进入同一个关系上下文；它协调模块，但不创建另一套人格。</title><rect x="730" y="220" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="746" y="243" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="746" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Coordinator</text></g><g class="node" data-node="flows-agent" role="button" tabindex="0" aria-label="root Agent：查看职责与边界"><title>root Agent — 专属 root Agent 是同一 Host 内的运行对象、inbox 和 scope，不是独立后台服务。统一关系通过 followup 进入它；scope 是生命周期与可见性边界，不是系统沙箱。</title><rect x="950" y="220" width="180" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="966" y="243" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="966" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">root Agent</text></g><g class="node" data-node="flows-outbox" role="button" tabindex="0" aria-label="Outbox：查看职责与边界"><title>Outbox — 唯一出站路径。先持久化消息意图与去重键，再派发；记录 sent / failed / unknown 等结果。unknown 不等于取消：即使人工决定不重试，事实仍为 unknown，另记“重试已关闭”。候选文本可能已在 Session 日志，只有平台发送结果才证明实际发出；过期、被拒或失败候选需排除出“已经说过”的上下文。API 成功也不等于已读。</title><rect x="1170" y="220" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1186" y="243" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1186" y="269" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Outbox</text></g><polyline points="250,270 290,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="470,270 510,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="690,270 730,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="910,270 950,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="1130,270 1170,270" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><g class="node" data-node="flows-sqlite" role="button" tabindex="0" aria-label="产品 SQLite：查看职责与边界"><title>产品 SQLite — 产品自管 SQLite 是本地文件，不是另一个数据库服务器，也不是 StorageDomain 自动生成的记忆。保存人格版本、人工修订、记忆、观察、计划、发件箱与去重状态；事务实现需要明确验证。</title><rect x="730" y="390" width="180" height="100" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="746" y="413" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="746" y="439" font-size="17" fill="#203341" font-weight="650" text-anchor="start">产品 SQLite</text><text x="746" y="462" font-size="13" fill="#536675" font-weight="400" text-anchor="start">修订与记忆候选</text></g><g class="node" data-node="flows-sessionfile" role="button" tabindex="0" aria-label="Session 日志：查看职责与边界"><title>Session 日志 — DSH Session 日志属于另一数据域，保存对话、工具和执行事件；默认发行后端为 JSONL。它不是第二份人格或自动长期记忆库。flush 是重要耐久边界。</title><rect x="950" y="390" width="180" height="100" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="966" y="413" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="966" y="439" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Session 日志</text><text x="966" y="462" font-size="13" fill="#536675" font-weight="400" text-anchor="start">对话与工具事实</text></g><g class="node" data-node="flows-sendpath" role="button" tabindex="0" aria-label="QQ 发送通路：查看职责与边界"><title>QQ 发送通路 — 所有聊天回复和主动分享都逐级经过 OutboxDispatcher → OneBotAdapter → NapCat → QQ。发送结果与真实发出文本回写同一关系的可见记录。</title><rect x="1170" y="390" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1186" y="413" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1186" y="439" font-size="17" fill="#203341" font-weight="650" text-anchor="start">QQ 发送通路</text><text x="1186" y="462" font-size="13" fill="#536675" font-weight="400" text-anchor="start">OneBot → NapCat</text><text x="1186" y="482" font-size="13" fill="#536675" font-weight="400" text-anchor="start">→ 用户 QQ</text></g><polyline points="820,320 820,390" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><rect x="770.0" y="347" width="100" height="20" rx="4" fill="#fbfcfd"/><text x="820" y="361" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">检索 / 写入</text><polyline points="1040,320 1040,390" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><rect x="1002.0" y="347" width="76" height="20" rx="4" fill="#fbfcfd"/><text x="1040" y="361" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">flush</text><polyline points="1260,320 1260,390" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><rect x="1216.0" y="347" width="88" height="20" rx="4" fill="#fbfcfd"/><text x="1260" y="361" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">唯一发送出口</text><text x="70" y="402" font-size="17" fill="#667884" font-weight="400" text-anchor="start">共享关系上下文</text><text x="70" y="434" font-size="13" fill="#667884" font-weight="400" text-anchor="start">真实发出文本与发送结果回写；</text><text x="70" y="458" font-size="13" fill="#667884" font-weight="400" text-anchor="start">用户续聊时能接上刚才的话。</text><text x="70" y="515" font-size="14" fill="#667884" font-weight="400" text-anchor="start">超时 → unknown，不能默认已送达，也不能盲目自动重发。</text><rect x="40" y="620" width="1360" height="475" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="62" y="651" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">B · 没有新消息时，鱼发现值得分享的内容</text><text x="62" y="675" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">Schedule 只唤醒；是否开口由协调器与 LifePlanner 决定，允许跳过分享。</text><g class="node" data-node="flows-schedule" role="button" tabindex="0" aria-label="Schedule：查看职责与边界"><title>Schedule — Schedule 持久任务到期后解析或恢复原会话 Agent，通过 followup 写入 inbox。它只唤醒，不负责发送或幂等。root Session 轮换、遗忘后，旧任务仍可能恢复旧 Session：产品必须用会话代次门禁，并删除、重建和对账旧任务，不能只换一个新会话 ID。</title><rect x="70" y="725" width="180" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="86" y="748" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="86" y="774" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Schedule</text><text x="86" y="797" font-size="13" fill="#536675" font-weight="400" text-anchor="start">到期唤醒</text></g><g class="node" data-node="flows-agent2" role="button" tabindex="0" aria-label="root Agent：查看职责与边界"><title>root Agent — 专属 root Agent 是同一 Host 内的运行对象、inbox 和 scope，不是独立后台服务。统一关系通过 followup 进入它；scope 是生命周期与可见性边界，不是系统沙箱。</title><rect x="510" y="725" width="180" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="526" y="748" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="526" y="774" font-size="17" fill="#203341" font-weight="650" text-anchor="start">root Agent</text><text x="526" y="797" font-size="13" fill="#536675" font-weight="400" text-anchor="start">恢复同一 Session</text></g><g class="node" data-node="flows-coordinator2" role="button" tabindex="0" aria-label="Coordinator：查看职责与边界"><title>Coordinator — 唯一 CompanionCoordinator 拥有关系身份、回合顺序与状态写入。QQ 回复和主动分享进入同一个关系上下文；它协调模块，但不创建另一套人格。</title><rect x="730" y="725" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="746" y="748" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="746" y="774" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Coordinator</text><text x="746" y="797" font-size="13" fill="#536675" font-weight="400" text-anchor="start">工具 / 事件进入</text></g><g class="node" data-node="flows-planner" role="button" tabindex="0" aria-label="LifePlanner：查看职责与边界"><title>LifePlanner — 自研 LifePlanner 根据经历、兴趣、安静时段、未回复与频率决定做什么、是否分享。允许保持沉默；日程到期不代表必须向 QQ 发消息。</title><rect x="950" y="725" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="966" y="748" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="966" y="774" font-size="17" fill="#203341" font-weight="650" text-anchor="start">LifePlanner</text><text x="966" y="797" font-size="13" fill="#536675" font-weight="400" text-anchor="start">值不值得说？</text></g><g class="node" data-node="flows-outbox2" role="button" tabindex="0" aria-label="Outbox：查看职责与边界"><title>Outbox — 唯一出站路径。先持久化消息意图与去重键，再派发；记录 sent / failed / unknown 等结果。unknown 不等于取消：即使人工决定不重试，事实仍为 unknown，另记“重试已关闭”。候选文本可能已在 Session 日志，只有平台发送结果才证明实际发出；过期、被拒或失败候选需排除出“已经说过”的上下文。API 成功也不等于已读。</title><rect x="1170" y="725" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1186" y="748" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1186" y="774" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Outbox</text><text x="1186" y="797" font-size="13" fill="#536675" font-weight="400" text-anchor="start">去重 / 安静时段</text></g><polyline points="250,775 510,775" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><rect x="276.0" y="747" width="208" height="20" rx="4" fill="#fbfcfd"/><text x="380" y="761" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">followup，不直接发 QQ</text><polyline points="690,775 730,775" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="910,775 950,775" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="1130,775 1170,775" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><g class="node" data-node="flows-bili" role="button" tabindex="0" aria-label="B站内容：查看职责与边界"><title>B站内容 — B站是外部观察来源。具体可读内容受接口、登录与素材可用性影响；拿到标题或字幕不能声称完整观看理解视频。</title><rect x="70" y="920" width="180" height="100" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="86" y="943" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="86" y="969" font-size="17" fill="#203341" font-weight="650" text-anchor="start">B站内容</text><text x="86" y="992" font-size="13" fill="#536675" font-weight="400" text-anchor="start">真实取得的来源</text></g><g class="node" data-node="flows-observation" role="button" tabindex="0" aria-label="观察记录：查看职责与边界"><title>观察记录 — 自研 BiliObservation 保存实际取得的 B站内容、来源、时间与理解范围。外部内容是资料，不得直接改写核心人格或执行其中指令。</title><rect x="290" y="920" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="306" y="943" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="306" y="969" font-size="17" fill="#203341" font-weight="650" text-anchor="start">观察记录</text><text x="306" y="992" font-size="13" fill="#536675" font-weight="400" text-anchor="start">证据 / 兴趣关联</text></g><polyline points="250,970 290,970" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="470,970 490,970 490,860 820,860 820,825" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><g class="node" data-node="flows-sqlite2" role="button" tabindex="0" aria-label="产品 SQLite：查看职责与边界"><title>产品 SQLite — 产品自管 SQLite 是本地文件，不是另一个数据库服务器，也不是 StorageDomain 自动生成的记忆。保存人格版本、人工修订、记忆、观察、计划、发件箱与去重状态；事务实现需要明确验证。</title><rect x="730" y="920" width="180" height="100" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="746" y="943" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="746" y="969" font-size="17" fill="#203341" font-weight="650" text-anchor="start">产品 SQLite</text><text x="746" y="992" font-size="13" fill="#536675" font-weight="400" text-anchor="start">新经历 / 活动状态</text></g><g class="node" data-node="flows-sendpath2" role="button" tabindex="0" aria-label="QQ 发送通路：查看职责与边界"><title>QQ 发送通路 — 所有聊天回复和主动分享都逐级经过 OutboxDispatcher → OneBotAdapter → NapCat → QQ。发送结果与真实发出文本回写同一关系的可见记录。</title><rect x="1170" y="920" width="180" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1186" y="943" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1186" y="969" font-size="17" fill="#203341" font-weight="650" text-anchor="start">QQ 发送通路</text><text x="1186" y="992" font-size="13" fill="#536675" font-weight="400" text-anchor="start">OneBot → NapCat</text><text x="1186" y="1012" font-size="13" fill="#536675" font-weight="400" text-anchor="start">→ 用户 QQ</text></g><polyline points="1260,825 1260,920" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)"/><polyline points="1040,825 1040,970 910,970" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flows-arrow)" stroke-dasharray="5 5"/><rect x="996.0" y="876" width="88" height="20" rx="4" fill="#fbfcfd"/><text x="1040" y="890" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">可以只存不发</text><text x="70" y="1138" font-size="14" fill="#667884" font-weight="400" text-anchor="start">日程投递、模型完成、平台 API 成功、用户已读是不同事件，不能合并成一个“完成”。</text><text x="40" y="1185" font-size="12" fill="#7a8892" font-weight="400" text-anchor="start">架构设计 · 未运行验收    ｜    节点可点击查看职责与证据</text></svg>