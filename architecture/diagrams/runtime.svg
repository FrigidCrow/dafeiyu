<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1150" role="img" aria-labelledby="runtime-title runtime-desc"><title id="runtime-title">DSH 底层：插件树如何成为一个运行中的 Agent</title><desc id="runtime-desc">官方结构依据固定源码；橙色区域为这次产品准备增加的模块。scope 控制可见性和生命周期，不是安全沙箱。</desc><defs><marker id="runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#8999a6"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .node{cursor:pointer;outline:none} .node:focus rect,.node:hover rect{stroke-width:2.5}</style><rect width="1440" height="1150" fill="#fbfcfd"/><text x="40" y="47" font-size="27" fill="#263644" font-weight="700" text-anchor="start">DSH 底层：插件树如何成为一个运行中的 Agent</text><text x="40" y="78" font-size="15" fill="#637480" font-weight="400" text-anchor="start">官方结构依据固定源码；橙色区域为这次产品准备增加的模块。scope 控制可见性和生命周期，不是安全沙箱。</text><g class="node" data-node="runtime-launcher" role="button" tabindex="0" aria-label="启动入口：查看职责与边界"><title>启动入口 — 共享 profile runner / app-boot / Cordis Loader 组成 Host 插件树。这里复用 DSH 启动体系，不重新实现宿主。</title><rect x="40" y="110" width="270" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="56" y="133" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="56" y="159" font-size="17" fill="#203341" font-weight="650" text-anchor="start">启动入口</text><text x="56" y="182" font-size="13" fill="#536675" font-weight="400" text-anchor="start">CLI / Desktop shell</text></g><g class="node" data-node="runtime-profile" role="button" tabindex="0" aria-label="Profile + bundles + patches：查看职责与边界"><title>Profile + bundles + patches — Launcher 按顺序合并 profile bundles 和 patches。产品使用专用 DSH home 下的 Web profile；bundle 是代码与配置发行形式，不是新进程。</title><rect x="365" y="110" width="300" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="381" y="133" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="381" y="159" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Profile + bundles + patches</text><text x="381" y="182" font-size="13" fill="#536675" font-weight="400" text-anchor="start">专用 home · 标准 Web profile</text></g><g class="node" data-node="runtime-loader" role="button" tabindex="0" aria-label="profile runner / Cordis：查看职责与边界"><title>profile runner / Cordis — 共享 profile runner / app-boot / Cordis Loader 组成 Host 插件树。这里复用 DSH 启动体系，不重新实现宿主。</title><rect x="720" y="110" width="300" height="100" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="736" y="133" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="736" y="159" font-size="17" fill="#203341" font-weight="650" text-anchor="start">profile runner / Cordis</text><text x="736" y="182" font-size="13" fill="#536675" font-weight="400" text-anchor="start">装配共享服务和插件树</text></g><g class="node" data-node="runtime-ui" role="button" tabindex="0" aria-label="浏览器管理页：查看职责与边界"><title>浏览器管理页 — 管理页运行在系统浏览器中，与 DSH Host 分属不同运行环境。HTML、CSS、JS 与业务 API 由 Host 提供；关闭网页不等于停止后台。</title><rect x="1080" y="110" width="320" height="100" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1096" y="133" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1096" y="159" font-size="17" fill="#203341" font-weight="650" text-anchor="start">浏览器管理页</text><text x="1096" y="182" font-size="13" fill="#536675" font-weight="400" text-anchor="start">独立客户端运行环境</text></g><polyline points="310,160 365,160" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="665,160 720,160" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><rect x="40" y="260" width="1360" height="690" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="62" y="291" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">Host · 同一个 Node 进程</text><text x="62" y="315" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">共享服务 + Preset scope + Agent scope；每个框不代表一个进程</text><g class="node" data-node="runtime-registry" role="button" tabindex="0" aria-label="AgentRegistry / AgentLoop：查看职责与边界"><title>AgentRegistry / AgentLoop — AgentRegistry 提供 create/resume 管理面；AgentLoop 注册具体 factory/driver。返回的 handle 拥有释放权。</title><rect x="70" y="340" width="285" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="86" y="363" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="86" y="389" font-size="17" fill="#203341" font-weight="650" text-anchor="start">AgentRegistry / AgentLoop</text><text x="86" y="412" font-size="13" fill="#536675" font-weight="400" text-anchor="start">create / resume / handle</text></g><g class="node" data-node="runtime-preset" role="button" tabindex="0" aria-label="Preset Registry：查看职责与边界"><title>Preset Registry — Preset 定义共享注册 scope 和插件树修订。Agent 保留选中的组成修订；更新 preset 不等于自动改写所有存量 Agent。</title><rect x="70" y="470" width="285" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="86" y="493" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="86" y="519" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Preset Registry</text><text x="86" y="542" font-size="13" fill="#536675" font-weight="400" text-anchor="start">定义修订 + shared scope</text></g><g class="node" data-node="runtime-schedule" role="button" tabindex="0" aria-label="Schedule：查看职责与边界"><title>Schedule — Schedule 持久任务到期后解析或恢复原会话 Agent，通过 followup 写入 inbox。它只唤醒，不负责发送或幂等。root Session 轮换、遗忘后，旧任务仍可能恢复旧 Session：产品必须用会话代次门禁，并删除、重建和对账旧任务，不能只换一个新会话 ID。</title><rect x="70" y="600" width="285" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="86" y="623" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="86" y="649" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Schedule</text><text x="86" y="672" font-size="13" fill="#536675" font-weight="400" text-anchor="start">持久任务 · 到期 followup</text></g><g class="node" data-node="runtime-storage" role="button" tabindex="0" aria-label="StorageDomain：查看职责与边界"><title>StorageDomain — StorageDomain 支持 JSON/SQLite provider，保存调度等非 Session 宿主状态。产品选择自管 SQLite，单独管理人格、记忆与发件箱；不能从官方存储机制推导产品自动记忆或跨库事务保证。</title><rect x="70" y="790" width="285" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="86" y="813" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="86" y="839" font-size="17" fill="#203341" font-weight="650" text-anchor="start">StorageDomain</text><text x="86" y="862" font-size="13" fill="#536675" font-weight="400" text-anchor="start">调度等非会话宿主状态</text></g><rect x="415" y="340" width="580" height="385" rx="18" fill="white" stroke="#2563a6" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="437" y="371" font-size="18" fill="#2563a6" font-weight="650" text-anchor="start">专属 root Agent scope</text><text x="437" y="395" font-size="13" fill="#6c7d89" font-weight="400" text-anchor="start">接口按 scope 可见；LLM / Tools 运行服务由 Host 共享</text><g class="node" data-node="runtime-agent" role="button" tabindex="0" aria-label="root Agent：inbox → turn → step：查看职责与边界"><title>root Agent：inbox → turn → step — 专属 root Agent 是同一 Host 内的运行对象、inbox 和 scope，不是独立后台服务。统一关系通过 followup 进入它；scope 是生命周期与可见性边界，不是系统沙箱。</title><rect x="450" y="415" width="510" height="85" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="466" y="438" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="466" y="464" font-size="17" fill="#203341" font-weight="650" text-anchor="start">root Agent：inbox → turn → step</text></g><g class="node" data-node="runtime-prompt" role="button" tabindex="0" aria-label="上下文组装：查看职责与边界"><title>上下文组装 — 每轮从稳定人格、相关记忆、Session 和可见工具组装模型上下文。inject 补上下文，不能代替 followup 唤醒。</title><rect x="450" y="540" width="230" height="90" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="466" y="563" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="466" y="589" font-size="17" fill="#203341" font-weight="650" text-anchor="start">上下文组装</text><text x="466" y="612" font-size="13" fill="#536675" font-weight="400" text-anchor="start">人格 / 记忆 / tools</text></g><g class="node" data-node="runtime-llm" role="button" tabindex="0" aria-label="LLM adapter：查看职责与边界"><title>LLM adapter — LLM adapter prepareCall 后执行模型 API 请求；流式结果可能为文本或工具调用。重试与失败必须结合宿主实际语义验证。</title><rect x="730" y="540" width="230" height="90" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="746" y="563" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="746" y="589" font-size="17" fill="#203341" font-weight="650" text-anchor="start">LLM adapter</text><text x="746" y="612" font-size="13" fill="#536675" font-weight="400" text-anchor="start">prepareCall / 流式请求</text></g><g class="node" data-node="runtime-session" role="button" tabindex="0" aria-label="Session：查看职责与边界"><title>Session — Session 是追加式执行事件和上下文投影。Agent 生成的候选可能已经进入日志，但不等于 QQ 已发送；取消或失效候选必须排除在“已说过”的上下文之外。产品长期记忆由独立模块提取和维护。</title><rect x="450" y="650" width="230" height="65" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="466" y="673" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="466" y="699" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Session</text></g><g class="node" data-node="runtime-tools" role="button" tabindex="0" aria-label="Tools / 策略执行：查看职责与边界"><title>Tools / 策略执行 — 工具注册、策略与执行器处理模型 tool calls，结果回到同一 Agent 回合。给模型工具不等于允许绕过发件箱直接向 QQ 发送。</title><rect x="730" y="650" width="230" height="65" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="746" y="673" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="746" y="699" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Tools / 策略执行</text></g><g class="node" data-node="runtime-web" role="button" tabindex="0" aria-label="Web Server：查看职责与边界"><title>Web Server — 复用 DSH webServer / Connection 的资源服务与认证连接。首次打开先经过宿主根路径 GET / 与 token 交换，再进入产品子路径；直接打开 /dafeiyu/ 不会自动完成登录。不能接管主站唯一 fallback。</title><rect x="1055" y="340" width="315" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="1071" y="363" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="1071" y="389" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Web Server</text><text x="1071" y="412" font-size="13" fill="#536675" font-weight="400" text-anchor="start">页面资源 / 认证连接</text></g><g class="node" data-node="runtime-gateway" role="button" tabindex="0" aria-label="Connection / API Gateway：查看职责与边界"><title>Connection / API Gateway — Connection / API Gateway 处理认证请求、远程调用与事件流，Host 保持权威状态。网页或正式客户端插件都不能成为第二个后端。</title><rect x="1055" y="470" width="315" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="1071" y="493" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="1071" y="519" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Connection / API Gateway</text><text x="1071" y="542" font-size="13" fill="#536675" font-weight="400" text-anchor="start">请求、事件、远程调用</text></g><g class="node" data-node="runtime-bundle" role="button" tabindex="0" aria-label="统一 Companion 插件：查看职责与边界"><title>统一 Companion 插件 — 统一 bundle 内包含产品后端、适配模块与预构建页面。产品模块共用一个状态和协调器，禁止各自启动另一个记忆或主动发信系统。</title><rect x="1055" y="600" width="315" height="95" rx="12" fill="#fff5e9" stroke="#bc641c" stroke-opacity=".55"/><text x="1071" y="623" font-size="10" fill="#bc641c" font-weight="650" text-anchor="start">待自研设计</text><text x="1071" y="649" font-size="17" fill="#203341" font-weight="650" text-anchor="start">统一 Companion 插件</text><text x="1071" y="672" font-size="13" fill="#536675" font-weight="400" text-anchor="start">API / 协调 / 人格记忆 / 出站</text></g><g class="node" data-node="runtime-persistence" role="button" tabindex="0" aria-label="SessionPersistence：查看职责与边界"><title>SessionPersistence — SessionPersistence 管理读取、append、flush、close 和写入所有权。内存接纳一条消息不等于已达到崩溃耐久保证。</title><rect x="415" y="790" width="580" height="95" rx="12" fill="#edf5ff" stroke="#2563a6" stroke-opacity=".55"/><text x="431" y="813" font-size="10" fill="#2563a6" font-weight="650" text-anchor="start">官方已有能力</text><text x="431" y="839" font-size="17" fill="#203341" font-weight="650" text-anchor="start">SessionPersistence</text><text x="431" y="862" font-size="13" fill="#536675" font-weight="400" text-anchor="start">append / flush / close · 可替换持久后端</text></g><polyline points="355,387 450,455" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="355,517 415,517" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)" stroke-dasharray="5 5"/><polyline points="355,647 390,647 390,455 450,455" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><rect x="352.0" y="573" width="76" height="20" rx="4" fill="#fbfcfd"/><text x="390" y="587" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">恢复后唤醒</text><polyline points="565,500 565,540" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="680,585 730,585" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="845,630 845,650" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="730,683 680,683" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><rect x="673.0" y="697" width="64" height="20" rx="4" fill="#fbfcfd"/><text x="705" y="711" font-size="12" fill="#5c6e7a" font-weight="400" text-anchor="middle">工具结果</text><polyline points="565,715 565,790" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="1240,210 1240,340" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="1212,435 1212,470" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="1212,565 1212,600" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="1055,647 1015,647 1015,455 960,455" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><g class="node" data-node="runtime-sessionfile" role="button" tabindex="0" aria-label="Session JSONL 文件：查看职责与边界"><title>Session JSONL 文件 — DSH Session 日志属于另一数据域，保存对话、工具和执行事件；默认发行后端为 JSONL。它不是第二份人格或自动长期记忆库。flush 是重要耐久边界。</title><rect x="415" y="1010" width="300" height="95" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="431" y="1033" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="431" y="1059" font-size="17" fill="#203341" font-weight="650" text-anchor="start">Session JSONL 文件</text><text x="431" y="1082" font-size="13" fill="#536675" font-weight="400" text-anchor="start">对话 / 工具 / 执行日志</text></g><g class="node" data-node="runtime-model" role="button" tabindex="0" aria-label="外部模型 API：查看职责与边界"><title>外部模型 API — DeepSeek 云端模型通过 API 接收请求。AgentLoop 和产品状态留在本机/服务器 Host；调用成本、失败和模型版本要单独记录。</title><rect x="745" y="1010" width="280" height="95" rx="12" fill="#f5f0fb" stroke="#73559f" stroke-opacity=".55"/><text x="761" y="1033" font-size="10" fill="#73559f" font-weight="650" text-anchor="start">外部组件</text><text x="761" y="1059" font-size="17" fill="#203341" font-weight="650" text-anchor="start">外部模型 API</text><text x="761" y="1082" font-size="13" fill="#536675" font-weight="400" text-anchor="start">Host 发起请求</text></g><g class="node" data-node="runtime-dshstate" role="button" tabindex="0" aria-label="DSH 状态存储：查看职责与边界"><title>DSH 状态存储 — DSH 宿主状态存储，使用 JSON 或 SQLite provider 保存调度等非会话状态。产品自管 SQLite 在产品总览另列；其人格、记忆与发件箱不是由此自动提供，也不能把两者视为同一个事务域。</title><rect x="1055" y="1010" width="315" height="110" rx="12" fill="#edf8f2" stroke="#28795d" stroke-opacity=".55"/><text x="1071" y="1033" font-size="10" fill="#28795d" font-weight="650" text-anchor="start">持久数据</text><text x="1071" y="1059" font-size="17" fill="#203341" font-weight="650" text-anchor="start">DSH 状态存储</text><text x="1071" y="1082" font-size="13" fill="#536675" font-weight="400" text-anchor="start">JSON 或 SQLite</text><text x="1071" y="1102" font-size="13" fill="#536675" font-weight="400" text-anchor="start">调度与非会话宿主状态</text></g><polyline points="565,885 565,1010" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)"/><polyline points="960,585 1025,585 1025,975 885,975 885,1010" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)" stroke-dasharray="5 5"/><polyline points="355,837 390,837 390,930 1212,930 1212,1010" fill="none" stroke="#8999a6" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#runtime-arrow)" stroke-dasharray="5 5"/><text x="40" y="1125" font-size="12" fill="#7a8892" font-weight="400" text-anchor="start">架构设计 · 未运行验收    ｜    节点可点击查看职责与证据</text></svg>